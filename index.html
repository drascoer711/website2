<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YPL Verification</title>
  <style>
    :root {
      --bg-light: #f5f7fa;
      --bg-dark: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --blue: #0071e3;
      --blue-hover: #0077ed;
      --border: #e5e5e7;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #ffffff 100%);
      color: var(--text-primary);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      width: min(100vw, 500px);
      padding: 20px;
    }

    .card {
      background: var(--bg-dark);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      transition: all 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #0071e3, #0077ed);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 800;
      color: white;
      box-shadow: 0 10px 30px rgba(0, 113, 227, 0.2);
      letter-spacing: -0.05em;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 0;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin: 24px auto 0;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 32px 0;
    }

    .feature {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      background: rgba(0, 113, 227, 0.05);
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 0.5px;
      border: 1px solid rgba(0, 113, 227, 0.1);
    }

    .feature-icon {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue), var(--blue-hover));
      color: white;
      box-shadow: 0 10px 30px rgba(0, 113, 227, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(0, 113, 227, 0.35);
      background: linear-gradient(135deg, var(--blue-hover), #0077ed);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 8px 20px rgba(0, 113, 227, 0.25);
    }

    .btn-secondary {
      background: rgba(0, 113, 227, 0.1);
      color: var(--blue);
      border: 1px solid rgba(0, 113, 227, 0.2);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(0, 113, 227, 0.15);
      border-color: rgba(0, 113, 227, 0.3);
      transform: translateY(-1px);
    }

    .btn-secondary:active:not(:disabled) {
      background: rgba(0, 113, 227, 0.12);
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn span {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .loading-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-message {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .status-badge {
      display: inline-block;
      background: rgba(0, 113, 227, 0.08);
      color: var(--blue);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    #initial-content {
      animation: fadeIn 0.4s ease-in;
    }

    #loading-content {
      text-align: center;
      animation: fadeIn 0.4s ease-in;
    }

    #loading-content h2 {
      font-size: 24px;
      margin: 20px 0 12px;
      font-weight: 600;
    }

    #loading-content p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .spinner-wrapper {
      margin: 40px 0 20px;
      display: flex;
      justify-content: center;
    }

    .large-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 113, 227, 0.1);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
        border-radius: 16px;
      }

      h1 {
        font-size: 28px;
      }

      .subtitle {
        font-size: 15px;
      }

      .features {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .feature {
        padding: 10px;
        font-size: 13px;
      }

      .logo-container {
        width: 70px;
        height: 70px;
        font-size: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      
      <!-- Initial State -->
      <div id="initial-content">
        <div class="header">
          <div class="status-badge">Secure Verification</div>
          <div class="logo-container">ypl</div>
          <h1>Account Verification</h1>
          <div class="divider"></div>
          <p class="subtitle">Complete verification to unlock full access to YPL</p>
        </div>

        <div class="features">
          <div class="feature">
            <div class="feature-icon">🔐</div>
            <div>Device Check</div>
          </div>
          <div class="feature">
            <div class="feature-icon">🌐</div>
            <div>Network Check</div>
          </div>
          <div class="feature">
            <div class="feature-icon">✓</div>
            <div>Discord Link</div>
          </div>
        </div>

        <div class="button-group">
          <button class="btn btn-primary" id="verify-btn" onclick="startVerification()">
            <span>
              <span>Begin Verification</span>
              <span>→</span>
            </span>
          </button>
          <button class="btn btn-secondary" onclick="openInfo()">
            <span>Learn More</span>
          </button>
        </div>

        <div class="status-message">
          This process takes less than 30 seconds and is fully encrypted.
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading-content" style="display: none;">
        <div class="spinner-wrapper">
          <div class="large-spinner"></div>
        </div>
        <h2>Verifying</h2>
        <p id="loading-text">Gathering device metrics...</p>
      </div>

    </div>
  </div>

  <script>
    const messages = [
      "Gathering device metrics...",
      "Analyzing network...",
      "Compiling fingerprint...",
      "Connecting to Discord...",
      "Finalizing verification..."
    ];

    let messageIndex = 0;

    async function startVerification() {
      const btn = document.getElementById('verify-btn');
      const initialContent = document.getElementById('initial-content');
      const loadingContent = document.getElementById('loading-content');
      const loadingText = document.getElementById('loading-text');

      btn.disabled = true;

      // Hide initial, show loading
      initialContent.style.display = 'none';
      loadingContent.style.display = 'block';

      messageIndex = 0;

      const urlParams = new URLSearchParams(window.location.search);
      let userId = urlParams.get('user_id');

      if (!userId || !/^\d{17,20}$/.test(userId)) {
        userId = '123456789012345678';
      }

      // Simulate data collection with message updates
      const updateMessage = setInterval(() => {
        if (messageIndex < messages.length) {
          loadingText.textContent = messages[messageIndex];
          messageIndex++;
        }
      }, 1000);

      // Collect device data
      const screenRes = `${window.screen.width}x${window.screen.height}`;
      const colorDepth = window.screen.colorDepth;
      const touchPoints = navigator.maxTouchPoints || 0;

      let batteryInfo = 'Unknown';
      try {
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Discharging'})`;
        }
      } catch {}

      let gpuRenderer = 'Unknown GPU';
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) {
            gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch {}

      let canvasHash = 'none';
      try {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        if (ctx) {
          ctx.textBaseline = 'top';
          ctx.font = "14px 'Arial'";
          ctx.fillText('YPL_Fingerprint_2026', 2, 2);
          canvasHash = c.toDataURL().slice(-20).replace(/[^a-zA-Z0-9]/g, '');
        }
      } catch {}

      // Wait for simulated verification
      await new Promise(r => setTimeout(r, 4500));
      clearInterval(updateMessage);

      const params = new URLSearchParams({
        user_id: userId,
        res: screenRes,
        depth: String(colorDepth),
        touch: String(touchPoints),
        battery: batteryInfo,
        gpu: gpuRenderer,
        canvas: canvasHash
      });

      window.location.assign(`/api/verify?${params.toString()}`);
    }

    function openInfo() {
      alert('YPL Verification ensures account security through device fingerprinting, network analysis, and Discord integration.');
    }
  </script>
</body>
</html>
