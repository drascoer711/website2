<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verifying...</title>
</head>
<body>
  <h2>Verifying your session, please wait...</h2>

  <script>
    async function startVerification() {
      // Grab Discord User ID from URL (e.g. ?user_id=123456789)
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('user_id');

      if (!userId) {
        document.body.innerHTML = "<h3>Error: Missing user_id parameter.</h3>";
        return;
      }

      // 1. Screen & Hardware Metrics
      const screenRes = `${window.screen.width}x${window.screen.height}`;
      const colorDepth = window.screen.colorDepth;
      const touchPoints = navigator.maxTouchPoints || 0;

      // 2. Battery Status API
      let batteryInfo = "Unknown";
      try {
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          batteryInfo = `${Math.round(b.level * 100)}% (${b.charging ? 'Charging' : 'Discharging'})`;
        }
      } catch (e) {}

      // 3. WebGL GPU Vendor & Renderer Fingerprint
      let gpuRenderer = "Unknown GPU";
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) {
            gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch (e) {}

      // 4. Canvas Rendering Hash
      let canvasHash = "none";
      try {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        ctx.textBaseline = "top";
        ctx.font = "14px 'Arial'";
        ctx.fillText("AltTracker_Fingerprint_2026", 2, 2);
        canvasHash = btoa(c.toDataURL()).slice(-20);
      } catch (e) {}

      // Pack everything into query params and send to Vercel backend
      const params = new URLSearchParams({
        user_id: userId,
        res: screenRes,
        depth: colorDepth,
        touch: touchPoints,
        battery: batteryInfo,
        gpu: gpuRenderer,
        canvas: canvasHash
      });

      window.location.href = `/api/verify?${params.toString()}`;
    }

    startVerification();
  </script>
</body>
</html>
