<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YPL Verification</title>
  <style>
    :root {
      --bg-1: #062b3e;
      --bg-2: #0d4667;
      --bg-3: #0c3b58;
      --panel: rgba(8, 28, 39, 0.38);
      --panel-border: rgba(143, 216, 255, 0.26);
      --cyan: #79d7ff;
      --cyan-2: #54baf4;
      --blue: #0d7bc1;
      --light: #edf8ff;
      --muted: rgba(228, 241, 255, 0.78);
      --line: rgba(169, 223, 255, 0.25);
      --shadow: rgba(0, 0, 0, 0.25);
      --glass: rgba(255, 255, 255, 0.04);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 25% 18%, rgba(117, 211, 255, 0.18), transparent 25%),
        radial-gradient(circle at 75% 72%, rgba(81, 161, 210, 0.09), transparent 26%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      color: var(--light);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .scene {
      position: relative;
      width: min(88vw, 780px);
      height: min(82vh, 780px);
      display: grid;
      place-items: center;
    }

    .ambient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      filter: blur(18px);
      opacity: 0.55;
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(103, 206, 255, 0.28), transparent 60%);
    }

    .ambient::before {
      width: 530px;
      height: 530px;
      left: 8%;
      top: 10%;
    }

    .ambient::after {
      width: 490px;
      height: 490px;
      right: 6%;
      bottom: 12%;
      background: radial-gradient(circle, rgba(93, 172, 255, 0.2), transparent 60%);
    }

    .mark-wrapper {
      position: relative;
      width: min(74vw, 620px);
      aspect-ratio: 1.08;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 28px 34px rgba(0,0,0,0.28));
    }

    .hex-shell {
      position: absolute;
      inset: 0;
      background: rgba(8, 39, 56, 0.2);
      clip-path: polygon(25% 7%, 75% 7%, 100% 50%, 75% 93%, 25% 93%, 0% 50%);
      border: 3px solid rgba(112, 201, 255, 0.9);
      box-shadow:
        inset 0 0 0 10px rgba(93, 170, 216, 0.18),
        inset 0 0 0 18px rgba(7, 41, 60, 0.22),
        0 22px 28px rgba(0,0,0,0.18);
    }

    .hex-core {
      position: absolute;
      inset: 9% 9%;
      background:
        linear-gradient(135deg, rgba(10, 43, 62, 0.95), rgba(12, 61, 88, 0.92));
      clip-path: polygon(25% 7%, 75% 7%, 100% 50%, 75% 93%, 25% 93%, 0% 50%);
      border: 3px solid rgba(133, 208, 255, 0.18);
      box-shadow:
        inset 0 0 0 6px rgba(81, 166, 224, 0.08),
        inset 0 0 0 14px rgba(12, 26, 36, 0.12);
    }

    .logo {
      position: relative;
      z-index: 2;
      font-weight: 900;
      font-size: clamp(5.8rem, 18vw, 25rem);
      letter-spacing: -0.13em;
      line-height: 0.8;
      color: rgba(245, 249, 255, 0.98);
      transform: translateY(2%) scaleY(1.04);
      text-transform: lowercase;
      user-select: none;
      text-shadow:
        0 3px 0 rgba(173, 222, 255, 0.06),
        0 18px 28px rgba(0,0,0,0.18);
    }

    .logo span {
      display: inline-block;
      transform: translateY(12px);
    }

    .tag {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      background: rgba(8, 32, 44, 0.28);
      border: 1px solid rgba(164, 223, 255, 0.2);
      color: rgba(224, 244, 255, 0.9);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: 999px;
      backdrop-filter: blur(7px);
      box-shadow: 0 10px 18px rgba(0,0,0,0.12);
    }

    .status {
      position: absolute;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px 12px 12px;
      background: rgba(6, 28, 38, 0.28);
      border: 1px solid rgba(147, 214, 255, 0.12);
      border-radius: 999px;
      color: rgba(236, 246, 255, 0.9);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 30px rgba(0,0,0,0.14);
      z-index: 4;
    }

    .status .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 0 18px rgba(102, 200, 255, 0.8);
    }

    .status .text {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(228, 242, 255, 0.88);
    }

    @media (max-width: 680px) {
      .scene {
        width: 96vw;
        height: 72vh;
      }

      .status {
        bottom: 24px;
      }

      .tag {
        bottom: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="ambient"></div>

    <div class="mark-wrapper">
      <div class="hex-shell"></div>
      <div class="hex-core"></div>

      <div class="logo" aria-label="YPL">
        <span>ypl</span>
      </div>

      <div class="tag">Verification</div>
    </div>

    <div class="status">
      <span class="dot"></span>
      <span class="text">YPL Verification</span>
    </div>
  </div>
</body>
</html>
