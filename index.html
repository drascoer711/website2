<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YPL Verify</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f4769 0%, #0a2f45 50%, #062b3e 100%);
      color: #1d1d1f;
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 40px 20px;
      animation: fadeIn 0.6s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .hex-logo {
      width: 140px;
      height: 140px;
      margin: 0 auto 30px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:%230d7bc1;stop-opacity:1" /><stop offset="100%" style="stop-color:%230b5a9d;stop-opacity:1" /></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/></filter></defs><g filter="url(%23shadow)"><polygon points="100,20 170,50 170,150 100,180 30,150 30,50" fill="url(%23hexGrad)" stroke="%2362d2ff" stroke-width="3"/><polygon points="100,40 155,65 155,135 100,160 45,135 45,65" fill="none" stroke="%231a4d6d" stroke-width="2" opacity="0.4"/></g><g><path d="M 80 70 L 70 70 L 70 120 L 80 130 L 90 130 L 90 80 Q 90 70 80 70" fill="%23edf8ff" opacity="0.95"/><path d="M 110 70 L 130 70 L 130 130 L 120 130 L 110 120 L 110 70" fill="%23edf8ff" opacity="0.95"/></g></svg>') center / contain no-repeat;
      opacity: 0.95;
      filter: drop-shadow(0 10px 30px rgba(0, 113, 227, 0.25));
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 24px;
      margin-bottom: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .feature-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 28px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      transition: all 0.2s ease;
    }

    .feature:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .feature-icon {
      font-size: 24px;
      min-width: 32px;
    }

    .feature-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      padding: 16px 20px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0071e3 0%, #0077ed 100%);
      color: white;
      box-shadow: 0 12px 30px rgba(0, 113, 227, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(0, 113, 227, 0.4);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .support-link {
      text-align: center;
      color: rgba(255, 255, 255, 0.65);
      font-size: 14px;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    .support-link strong {
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 16px;
      }

      .hex-logo {
        width: 110px;
        height: 110px;
      }

      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 16px;
      }

      .card {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-section">
      <div class="hex-logo"></div>
    </div>

    <div class="header">
      <h1>YPL Verify</h1>
      <p class="subtitle">Secure account verification to unlock full access</p>
    </div>

    <div class="card">
      <div class="feature-grid">
        <div class="feature">
          <div class="feature-icon">🔒</div>
          <div class="feature-text">Alt Check</div>
        </div>
        <div class="feature">
          <div class="feature-icon">🌐</div>
          <div class="feature-text">Network Check</div>
        </div>
        <div class="feature">
          <div class="feature-icon">✓</div>
          <div class="feature-text">Discord Link</div>
        </div>
      </div>

      <div class="button-group">
        <button class="btn btn-primary" id="verify-btn" onclick="startVerification()">
          <span>Begin Verification</span>
          <span>→</span>
        </button>

        <button class="btn btn-secondary" id="support-btn" onclick="openSupport()">
          <span>Check support</span>
        </button>
      </div>
    </div>

    <div class="support-link">
      Check support if you <strong>can't verify</strong>
    </div>
  </div>

  <script>
    const messages = [
      "Checking device...",
      "Checking network...",
      "Checking alt data...",
      "Verifying account...",
      "Finalizing verification..."
    ];

    let messageIndex = 0;

    async function startVerification() {
      const btn = document.getElementById('verify-btn');
      const supportBtn = document.getElementById('support-btn');
      const subtitle = document.querySelector('.subtitle');
      const originalSubtitle = subtitle.textContent;

      btn.disabled = true;
      supportBtn.disabled = true;

      messageIndex = 0;

      const interval = setInterval(() => {
        if (messageIndex < messages.length) {
          subtitle.textContent = messages[messageIndex];
          messageIndex++;
        } else {
          clearInterval(interval);
        }
      }, 700);

      const urlParams = new URLSearchParams(window.location.search);
      let userId = urlParams.get('user_id');

      if (!userId || !/^\d{17,20}$/.test(userId)) {
        userId = '123456789012345678';
      }

      const screenRes = `${window.screen.width}x${window.screen.height}`;
      const colorDepth = window.screen.colorDepth;
      const touchPoints = navigator.maxTouchPoints || 0;

      let batteryInfo = 'Unknown';
      try {
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Discharging'})`;
        }
      } catch {}

      let gpuRenderer = 'Unknown GPU';
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) {
            gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch {}

      let canvasHash = 'none';
      try {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        if (ctx) {
          ctx.textBaseline = 'top';
          ctx.font = "14px 'Arial'";
          ctx.fillText('YPL_VERIFY_2026', 2, 2);
          canvasHash = c.toDataURL().slice(-20).replace(/[^a-zA-Z0-9]/g, '');
        }
      } catch {}

      await new Promise(resolve => setTimeout(resolve, 3500));

      const params = new URLSearchParams({
        user_id: userId,
        res: screenRes,
        depth: String(colorDepth),
        touch: String(touchPoints),
        battery: batteryInfo,
        gpu: gpuRenderer,
        canvas: canvasHash
      });

      window.location.assign(`/api/verify?${params.toString()}`);
    }

    function openSupport() {
      alert('Support: If you cannot verify, contact the YPL support team with your account ID and a screenshot of this page.');
    }
  </script>
</body>
</html>
