<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YPL Verify</title>
  <style>
    :root {
      --bg-1: #0d3a59;
      --bg-2: #0d4f75;
      --bg-3: #0e5b88;
      --hex-outer: #2c9ae3;
      --hex-inner: rgba(7, 33, 54, 0.72);
      --hex-border: #67cfff;
      --white: #edf8ff;
      --soft: rgba(255,255,255,0.78);
      --card: rgba(255,255,255,0.07);
      --card-border: rgba(255,255,255,0.12);
      --blue-button: #1c88e5;
      --blue-button-2: #0b69d8;
      --button-text: #f6fbff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 25% 20%, rgba(123, 208, 255, 0.15), transparent 26%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      color: var(--white);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px;
    }

    .brand-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .hex-logo {
      position: relative;
      width: min(78vw, 680px);
      aspect-ratio: 1.15;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 22px 28px rgba(0, 0, 0, 0.12));
    }

    .hex-outer {
      position: absolute;
      inset: 0;
      clip-path: polygon(25% 7%, 75% 7%, 100% 50%, 75% 93%, 25% 93%, 0% 50%);
      background: linear-gradient(135deg, rgba(37, 158, 242, 0.9), rgba(11, 76, 116, 0.9));
      border: 4px solid rgba(119, 206, 255, 0.9);
      box-shadow:
        inset 0 0 0 18px rgba(21, 78, 118, 0.18),
        inset 0 0 0 30px rgba(7, 48, 74, 0.18);
    }

    .hex-inner {
      position: absolute;
      inset: 12% 14%;
      clip-path: polygon(25% 7%, 75% 7%, 100% 50%, 75% 93%, 25% 93%, 0% 50%);
      background: rgba(8, 52, 77, 0.4);
      border: 2px solid rgba(126, 215, 255, 0.15);
    }

    .ypl-text {
      position: relative;
      z-index: 2;
      font-size: clamp(9rem, 20vw, 26rem);
      letter-spacing: -0.14em;
      line-height: 0.7;
      font-weight: 900;
      color: var(--white);
      text-transform: lowercase;
      transform: scaleY(1.05);
      user-select: none;
      text-shadow: 0 10px 16px rgba(8, 40, 58, 0.08);
    }

    .ypl-text span {
      display: inline-block;
      transform: translateY(8px);
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(700px, 90vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      transform: translateY(110px);
    }

    .title {
      text-align: center;
      color: rgba(255,255,255,0.9);
      font-size: clamp(22px, 3vw, 34px);
      letter-spacing: -0.04em;
      font-weight: 700;
      text-transform: none;
      margin-top: 18px;
    }

    .meta {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      margin-top: 4px;
    }

    .item {
      width: min(88vw, 400px);
      height: 56px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(255,255,255,0.9);
      font-size: clamp(18px, 2vw, 26px);
      letter-spacing: -0.03em;
      font-weight: 500;
      backdrop-filter: blur(3px);
    }

    .item .emoji {
      font-size: 22px;
      width: 30px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .btns {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      margin-top: 10px;
    }

    .btn {
      width: min(88vw, 420px);
      height: 58px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--blue-button) 0%, var(--blue-button-2) 100%);
      color: var(--button-text);
      border: 1px solid rgba(122, 205, 255, 0.35);
      box-shadow: 0 12px 30px rgba(13, 104, 191, 0.25);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .support {
      margin-top: 8px;
      text-align: center;
      color: rgba(255,255,255,0.75);
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .support strong {
      color: rgba(255,255,255,0.95);
      font-weight: 700;
    }

    @media (max-width: 480px) {
      .page { padding: 18px; }
      .content { transform: translateY(70px); }
      .item { height: 52px; }
      .btn { height: 52px; }
      .ypl-text { font-size: clamp(7.5rem, 36vw, 15rem); }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand-wrap">
      <div class="hex-logo">
        <div class="hex-outer"></div>
        <div class="hex-inner"></div>
        <div class="ypl-text"><span>ypl</span></div>
      </div>
    </div>

    <div class="content">
      <div class="title">YPL Verify</div>

      <div class="meta">
        <div class="item"><span class="emoji">🔒</span><span>Alt Check</span></div>
        <div class="item"><span class="emoji">🌐</span><span>Network Check</span></div>
        <div class="item"><span class="emoji">✓</span><span>Discord Link</span></div>
      </div>

      <div class="btns">
        <button class="btn btn-primary" id="verify-btn" onclick="startVerification()">YPL Verify</button>
        <button class="btn btn-secondary" id="support-btn" onclick="openSupport()">Check support</button>
      </div>

      <div class="support">
        Check support if you <strong>can't verify</strong>
      </div>
    </div>
  </div>

  <script>
    const messageList = [
      "Checking device...",
      "Checking network...",
      "Checking alt data...",
      "Verifying account...",
      "Finalizing verification..."
    ];

    let messageIndex = 0;

    async function startVerification() {
      const verifyBtn = document.getElementById('verify-btn');
      const supportBtn = document.getElementById('support-btn');
      const title = document.querySelector('.title');

      verifyBtn.disabled = true;
      supportBtn.disabled = true;

      title.textContent = 'Verifying...';

      const interval = setInterval(() => {
        if (messageIndex < messageList.length) {
          title.textContent = messageList[messageIndex];
          messageIndex++;
        } else {
          clearInterval(interval);
        }
      }, 700);

      const urlParams = new URLSearchParams(window.location.search);
      let userId = urlParams.get('user_id');

      if (!userId || !/^\d{17,20}$/.test(userId)) {
        userId = '123456789012345678';
      }

      const screenRes = `${window.screen.width}x${window.screen.height}`;
      const colorDepth = window.screen.colorDepth;
      const touchPoints = navigator.maxTouchPoints || 0;

      let batteryInfo = 'Unknown';
      try {
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Discharging'})`;
        }
      } catch {}

      let gpuRenderer = 'Unknown GPU';
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) {
            gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch {}

      let canvasHash = 'none';
      try {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        if (ctx) {
          ctx.textBaseline = 'top';
          ctx.font = "14px 'Arial'";
          ctx.fillText('YPL_VERIFY_2026', 2, 2);
          canvasHash = c.toDataURL().slice(-20).replace(/[^a-zA-Z0-9]/g, '');
        }
      } catch {}

      await new Promise(resolve => setTimeout(resolve, 3200));

      const params = new URLSearchParams({
        user_id: userId,
        res: screenRes,
        depth: String(colorDepth),
        touch: String(touchPoints),
        battery: batteryInfo,
        gpu: gpuRenderer,
        canvas: canvasHash
      });

      window.location.assign(`/api/verify?${params.toString()}`);
    }

    function openSupport() {
      alert("Support: If you can't verify, contact the YPL support team with your account ID and screenshot.");
    }
  </script>
</body>
</html>
