<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YPL Verification</title>
  <style>
    :root {
      --bg-1: #0a2f45;
      --bg-2: #0f4769;
      --bg-3: #0a3d5b;
      --panel: rgba(7, 32, 46, 0.42);
      --panel-border: rgba(129, 197, 255, 0.3);
      --cyan: #62d2ff;
      --blue: #0d7ec9;
      --blue-2: #2aa9ff;
      --white: #edf8ff;
      --muted: rgba(237, 248, 255, 0.7);
      --line: rgba(170, 221, 255, 0.25);
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 30% 35%, rgba(87, 182, 255, 0.16), transparent 32%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      color: var(--white);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .shell {
      position: relative;
      width: min(92vw, 760px);
      min-height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap {
      position: relative;
      width: min(70vw, 620px);
      aspect-ratio: 1.1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 18px 26px rgba(0,0,0,0.22));
    }

    .hex-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 42, 62, 0.25);
      border: 3px solid rgba(113, 202, 255, 0.82);
      clip-path: polygon(25% 8%, 75% 8%, 100% 50%, 75% 92%, 25% 92%, 0% 50%);
      border-radius: 26px;
      box-shadow:
        inset 0 0 0 10px rgba(8, 81, 121, 0.25),
        0 26px 35px rgba(7, 20, 30, 0.18);
    }

    .hex-inner {
      position: absolute;
      inset: 9% 10%;
      background: rgba(11, 50, 73, 0.9);
      border: 3px solid rgba(100, 204, 255, 0.28);
      clip-path: polygon(25% 8%, 75% 8%, 100% 50%, 75% 92%, 25% 92%, 0% 50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ypl {
      position: relative;
      font-weight: 800;
      font-size: clamp(7rem, 22vw, 28rem);
      letter-spacing: -0.12em;
      line-height: 0.8;
      color: #edf8ff;
      text-transform: lowercase;
      transform: scaleY(1.02);
      user-select: none;
      text-shadow:
        0 0 0 rgba(255,255,255,0),
        0 4px 0 rgba(149, 211, 255, 0.05);
    }

    .ypl span {
      display: inline-block;
      transform: translateY(5px);
    }

    .tag {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 11px;
      color: rgba(210, 233, 255, 0.9);
      background: rgba(10, 41, 62, 0.3);
      border: 1px solid rgba(135, 202, 255, 0.18);
      padding: 8px 14px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
      font-weight: 700;
    }

    .panel {
      position: absolute;
      left: 50%;
      bottom: 50px;
      transform: translateX(-50%);
      width: min(86vw, 420px);
      background: rgba(7, 30, 45, 0.35);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 16px 20px;
      box-shadow: 0 14px 26px rgba(0,0,0,0.12);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .panel .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8ad6ff, #4bc0ff);
      box-shadow: 0 0 14px rgba(98, 210, 255, 0.8);
    }

    .panel p {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(228, 240, 255, 0.84);
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .shell {
        min-height: 540px;
      }

      .panel {
        bottom: 18px;
        width: min(82vw, 360px);
      }

      .panel p {
        font-size: 12px;
        letter-spacing: 0.12em;
      }

      .tag {
        bottom: 18px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="logo-wrap" aria-label="YPL Verification">
      <div class="hex-bg"></div>
      <div class="hex-inner"></div>
      <div class="ypl"><span>ypl</span></div>
      <div class="tag">Verification</div>
    </div>

    <div class="panel">
      <div class="dot"></div>
      <p>YPL Verification</p>
    </div>
  </div>
</body>
</html>
