<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Session Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1f22;
      color: #dbdee1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #2b2d31;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 100%;
    }
    .btn {
      background-color: #5865f2;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
    }
    .btn:hover {
      background-color: #4752c4;
    }
  </style>
</head>
<body>
  <div class="card" id="status-container">
    <h2>Verify Your Account</h2>
    <p>Click the button below to complete your server verification.</p>
    <button class="btn" id="verify-btn" onclick="startVerification()">Verify Me</button>
  </div>

  <script>
    async function startVerification() {
      const urlParams = new URLSearchParams(window.location.search);
      let userId = urlParams.get('user_id');

      // Fallback test ID if opened directly without a parameter
      if (!userId) {
        userId = '123456789012345678';
      }

      // Update UI to show progress
      document.getElementById('status-container').innerHTML = `
        <h2>Verifying...</h2>
        <p>Gathering session metrics, please wait...</p>
      `;

      // 1. Screen & Hardware Metrics
      const screenRes = `${window.screen.width}x${window.screen.height}`;
      const colorDepth = window.screen.colorDepth;
      const touchPoints = navigator.maxTouchPoints || 0;

      // 2. Battery Status API
      let batteryInfo = "Unknown";
      try {
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          batteryInfo = `${Math.round(b.level * 100)}% (${b.charging ? 'Charging' : 'Discharging'})`;
        }
      } catch (e) {}

      // 3. WebGL GPU Vendor & Renderer Fingerprint
      let gpuRenderer = "Unknown GPU";
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) {
            gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch (e) {}

      // 4. Canvas Rendering Hash
      let canvasHash = "none";
      try {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        ctx.textBaseline = "top";
        ctx.font = "14px 'Arial'";
        ctx.fillText("AltTracker_Fingerprint_2026", 2, 2);
        canvasHash = btoa(c.toDataURL()).slice(-20);
      } catch (e) {}

      // Pack everything into query params and send to Vercel backend
      const params = new URLSearchParams({
        user_id: userId,
        res: screenRes,
        depth: colorDepth,
        touch: touchPoints,
        battery: batteryInfo,
        gpu: gpuRenderer,
        canvas: canvasHash
      });

      window.location.href = `/api/verify?${params.toString()}`;
    }
  </script>
</body>
</html>
