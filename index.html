<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YPL Verify</title>
  <style>
    :root {
      --bg: #090b0d;
      --bg-soft: #12161a;
      --card: #141a1f;
      --card-2: #1a2128;
      --line: rgba(255,255,255,0.08);
      --text: #edf5ff;
      --muted: #9aa7b2;
      --blue: #1d8ef0;
      --blue-2: #0f6fd6;
      --blue-soft: rgba(29, 142, 240, 0.14);
      --white: #f8fbff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #090b0d 0%, #0d1116 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      width: min(100%, 440px);
    }

    .card {
      background: linear-gradient(180deg, rgba(20, 26, 31, 0.98), rgba(18, 22, 26, 0.96));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 30px 22px 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.28);
    }

    .top {
      text-align: center;
      margin-bottom: 28px;
    }

    .tiny {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--blue-soft);
      border: 1px solid rgba(29, 142, 240, 0.2);
      color: #a9d5ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 30px;
      letter-spacing: -0.05em;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--muted);
      letter-spacing: -0.02em;
      line-height: 1.5;
    }

    .features {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 28px 0 26px;
    }

    .feature {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 58px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .feature .icon {
      width: 26px;
      text-align: center;
      color: #9ed0ff;
      font-size: 20px;
    }

    .btns {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      height: 58px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--blue) 0%, var(--blue-2) 100%);
      color: white;
      box-shadow: 0 12px 28px rgba(29, 142, 240, 0.28);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .support {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    .support strong {
      color: var(--white);
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .card {
        padding: 26px 18px 18px;
      }

      h1 {
        font-size: 28px;
      }

      .feature {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="tiny">YPL</div>
        <h1>YPL Verify</h1>
        <p class="subtitle">Secure account verification to unlock full access.</p>
      </div>

      <div class="features">
        <div class="feature">
          <div class="icon">🔒</div>
          <div>Alt Check</div>
        </div>
        <div class="feature">
          <div class="icon">🌐</div>
          <div>Network Check</div>
        </div>
        <div class="feature">
          <div class="icon">✓</div>
          <div>Discord Link</div>
        </div>
      </div>

      <div class="btns">
        <button class="btn btn-primary" id="verify-btn" onclick="startVerification()">YPL Verify</button>
        <button class="btn btn-secondary" id="support-btn" onclick="openSupport()">Check Support</button>
      </div>

      <div class="support">
        Check support if you <strong>can’t verify</strong>
      </div>
    </div>
  </div>

  <script>
    const messages = [
      "Checking device...",
      "Checking network...",
      "Checking alt data...",
      "Verifying account...",
      "Finalizing verification..."
    ];

    async function startVerification() {
      const verifyBtn = document.getElementById('verify-btn');
      const supportBtn = document.getElementById('support-btn');
      const subtitle = document.querySelector('.subtitle');
      const title = document.querySelector('h1');

      verifyBtn.disabled = true;
      supportBtn.disabled = true;

      title.textContent = "Verifying";
      subtitle.textContent = "Checking your account details...";

      let index = 0;
      const interval = setInterval(() => {
        if (index < messages.length) {
          subtitle.textContent = messages[index];
          index++;
        } else {
          clearInterval(interval);
        }
      }, 700);

      const urlParams = new URLSearchParams(window.location.search);
      let userId = urlParams.get('user_id');

      if (!userId || !/^\d{17,20}$/.test(userId)) {
        userId = '123456789012345678';
      }

      const screenRes = `${window.screen.width}x${window.screen.height}`;
      const colorDepth = window.screen.colorDepth;
      const touchPoints = navigator.maxTouchPoints || 0;

      let batteryInfo = 'Unknown';
      try {
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Discharging'})`;
        }
      } catch {}

      let gpuRenderer = 'Unknown GPU';
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) {
            gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch {}

      let canvasHash = 'none';
      try {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        if (ctx) {
          ctx.textBaseline = 'top';
          ctx.font = "14px 'Arial'";
          ctx.fillText('YPL_VERIFY_2026', 2, 2);
          canvasHash = c.toDataURL().slice(-20).replace(/[^a-zA-Z0-9]/g, '');
        }
      } catch {}

      await new Promise(resolve => setTimeout(resolve, 3200));

      const params = new URLSearchParams({
        user_id: userId,
        res: screenRes,
        depth: String(colorDepth),
        touch: String(touchPoints),
        battery: batteryInfo,
        gpu: gpuRenderer,
        canvas: canvasHash
      });

      window.location.assign(`/api/verify?${params.toString()}`);
    }

    function openSupport() {
      alert("Support: If you can't verify, contact the YPL support team with your account ID and screenshot.");
    }
  </script>
</body>
</html>
